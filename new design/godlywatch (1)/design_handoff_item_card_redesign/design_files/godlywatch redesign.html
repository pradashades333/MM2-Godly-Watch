<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>godlywatch · v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0b14; }
  body { font-family: system-ui, sans-serif; color: #ece8df; }
  @keyframes gw-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  /* Hover lift on cards */
  .gw-card { transition: border-color .15s, transform .15s; }
  .gw-card:hover { border-color: rgba(255,255,255,0.14); transform: translateY(-1px); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="cards-v2.jsx"></script>
<script type="text/babel">

function App() {
  return (
    <div style={{ minHeight: '100vh', background: G.bg }}>
      <TopBar />
      <Ticker items={TICKER_V2} />
      <div style={{ display: 'flex', minHeight: 'calc(100vh - 64px - 36px)' }}>
        <Sidebar tierCounts={TIERS_V2} activeTier="all" />
        <main style={{ flex: 1, padding: '24px 28px 60px', minWidth: 0 }}>
          {/* Section header above the grid */}
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
            marginBottom: 18,
          }}>
            <div>
              <h1 style={{
                margin: 0, fontFamily: G.fontDisplay, fontSize: 32, fontWeight: 600,
                letterSpacing: '-0.005em',
              }}>Board</h1>
              <div style={{
                marginTop: 4, fontFamily: G.fontMono, fontSize: 11,
                color: G.inkFaint, letterSpacing: '0.06em',
              }}>184 items · 17 movers today · refreshed 2 min ago</div>
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              {['Grid', 'List', 'Compact'].map((m, i) => (
                <span key={m} style={{
                  padding: '6px 12px', borderRadius: 4,
                  fontFamily: G.fontDisplay, fontSize: 14, fontWeight: 500,
                  background: i === 0 ? G.cardHi : 'transparent',
                  border: `1px solid ${i === 0 ? G.lineHi : G.line}`,
                  color: i === 0 ? G.ink : G.inkDim,
                  cursor: 'pointer',
                }}>{m}</span>
              ))}
            </div>
          </div>

          {/* The grid — responsive: cards stay >=240px so numbers never clip */}
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))',
            gap: 14,
          }}>
            {ITEMS_V2.map(it => <Card key={it.name} item={it} />)}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
